<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Restringido - Backoffice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #030b1e; color: white; font-family: system-ui, sans-serif; }
        .neon-card { background: #0a1931; border: 1px solid #1b3a6b; box-shadow: 0 0 15px rgba(0, 210, 255, 0.1); }
        .neon-input { background-color: #030b1e; border: 1px solid #1b3a6b; }
        .neon-input:focus { outline: none; border-color: #00d2ff; box-shadow: 0 0 10px rgba(0, 210, 255, 0.3); }
        .form-check-input { width: 1.25rem; height: 1.25rem; cursor: pointer; accent-color: #00d2ff; }
    </style>
</head>
<body class="p-4 sm:p-8 flex items-center justify-center min-h-screen">

    <!-- LOGIN -->
    <div id="loginScreen" class="neon-card p-8 rounded-2xl w-full max-w-sm text-center">
        <div class="text-4xl mb-4 text-[#00d2ff]"><i class="fa-solid fa-lock"></i></div>
        <h2 class="text-xl font-bold mb-2">Acceso Restringido</h2>
        <p class="text-gray-400 text-sm mb-6">Ingresa la contraseña de administrador.</p>
        <input type="password" id="passwordInput" placeholder="Contraseña" class="neon-input w-full rounded-xl px-4 py-3 text-white mb-4 text-center" onkeypress="if(event.key === 'Enter') verificarPassword()">
        <button onclick="verificarPassword()" class="w-full bg-[#00d2ff] text-[#030b1e] font-bold py-3 rounded-xl hover:opacity-90 transition">Entrar</button>
        <p id="errorMsg" class="text-red-500 text-xs mt-3 hidden">Contraseña incorrecta.</p>
        <a href="index.html" class="block mt-4 text-xs text-gray-500 hover:text-white">Volver al inicio</a>
    </div>

    <!-- PANEL -->
    <div id="adminPanel" class="hidden max-w-6xl w-full mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold flex items-center gap-2"><span class="text-[#00d2ff]">📊</span> Backoffice - Asistentes</h1>
            <div class="flex gap-2">
                <button onclick="cerrarSesion()" class="bg-gray-700 text-white px-4 py-2 rounded-lg font-bold text-sm hover:opacity-90">Cerrar Sesión</button>
            </div>
        </div>

        <div class="mb-4">
            <input type="text" id="searchInput" onkeyup="filtrarTabla()" placeholder="🔍 Buscar por nombre, DNI o quién lo invitó..." class="w-full bg-[#030b1e] border border-[#1b3a6b] rounded-lg px-4 py-3 text-white focus:outline-none focus:border-[#00d2ff]">
        </div>

        <div class="neon-card rounded-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-300">
                    <thead class="text-xs uppercase bg-[#030b1e] text-[#00d2ff] border-b border-[#1b3a6b]">
                        <tr>
                            <th class="px-4 py-3">Fecha / Hora</th>
                            <th class="px-4 py-3">Nombre</th>
                            <th class="px-4 py-3">DNI</th>
                            <th class="px-4 py-3">Celular</th>
                            <th class="px-4 py-3">Invitado por</th>
                            <th class="px-4 py-3 text-center">Asistencia (Sorteo)</th>
                        </tr>
                    </thead>
                    <tbody id="tablaBody">
                        <tr><td colspan="6" class="text-center py-6 text-gray-500">Cargando datos desde la nube...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="mt-2 text-right text-xs text-gray-500" id="totalRegistros"></div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD0iSjTHn0tYsqE92EGFz7O9Tnkb9qayJA",
            authDomain: "evento-financiero-6439d.firebaseapp.com",
            projectId: "evento-financiero-6439d",
            storageBucket: "evento-financiero-6439d.firebasestorage.app",
            messagingSenderId: "123911404603",
            appId: "1:123911404603:web:24667ac5e4dbc0fea7701e",
            measurementId: "G-0Q8KYLPCPF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const CONTRASENAS_PERMITIDAS = ["admin123", "evento2024"]; 
        let asistentesGlobal = [];

        window.onload = function() {
            if (sessionStorage.getItem('adminLogueado') === 'true') {
                mostrarAdmin();
            }
        };

        window.verificarPassword = function() {
            const pass = document.getElementById('passwordInput').value;
            if (CONTRASENAS_PERMITIDAS.includes(pass)) {
                sessionStorage.setItem('adminLogueado', 'true');
                mostrarAdmin();
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
                document.getElementById('passwordInput').value = '';
            }
        };

        window.cerrarSesion = function() {
            sessionStorage.removeItem('adminLogueado');
            location.reload();
        };

        async function mostrarAdmin() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            await cargarDatos();
        }

        async function cargarDatos() {
            try {
                const q = query(collection(db, "asistentes"), orderBy("fecha", "desc"));
                const querySnapshot = await getDocs(q);
                
                asistentesGlobal = [];
                querySnapshot.forEach((documento) => {
                    const data = documento.data();
                    let fechaStr = 'Reciente';
                    if(data.fecha) {
                        fechaStr = data.fecha.toDate().toLocaleString();
                    }
                    asistentesGlobal.push({
                        id: documento.id,
                        fecha: fechaStr,
                        nombre: data.nombre || '',
                        dni: data.dni || '',
                        celular: data.celular || '',
                        invitado_por: data.invitado_por || 'N/D',
                        asistencia: data.asistencia === true
                    });
                });
                renderTabla(asistentesGlobal);
            } catch (error) {
                console.error("Error al cargar: ", error);
                document.getElementById('tablaBody').innerHTML = '<tr><td colspan="6" class="text-center py-6 text-red-500">Error al conectar con la base de datos. Revisa las reglas de Firestore.</td></tr>';
            }
        }

        function renderTabla(data) {
            const tbody = document.getElementById('tablaBody');
            tbody.innerHTML = '';
            document.getElementById('totalRegistros').innerText = `Total registrados: ${data.length}`;

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-6 text-gray-500">No hay registros aún.</td></tr>';
                return;
            }

            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = 'border-b border-[#1b3a6b] hover:bg-white/5 transition';
                tr.innerHTML = `
                    <td class="px-4 py-3 text-xs text-gray-400">${row.fecha}</td>
                    <td class="px-4 py-3 font-semibold text-white">${row.nombre}</td>
                    <td class="px-4 py-3 font-mono">${row.dni}</td>
                    <td class="px-4 py-3">${row.celular}</td>
                    <td class="px-4 py-3 text-cyan-300 font-medium">${row.invitado_por}</td>
                    <td class="px-4 py-3 text-center">
                        <input type="checkbox" class="form-check-input check-asistencia" ${row.asistencia ? 'checked' : ''} data-id="${row.id}">
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // Sincronizar el cambio del checkbox en tiempo real con Firestore
            document.querySelectorAll('.check-asistencia').forEach(checkbox => {
                checkbox.addEventListener('change', async function() {
                    const idDoc = this.getAttribute("data-id");
                    const nuevoEstado = this.checked;

                    try {
                        const docRef = doc(db, "asistentes", idDoc);
                        await updateDoc(docRef, {
                            asistencia: nuevoEstado
                        });
                        let reg = asistentesGlobal.find(r => r.id === idDoc);
                        if (reg) reg.asistencia = nuevoEstado;
                    } catch (error) {
                        console.error("Error al actualizar la asistencia en Firestore:", error);
                        alert("No se pudo actualizar la asistencia. Revisa las reglas de seguridad de Firestore.");
                        this.checked = !nuevoEstado; // Revierte el estado si ocurre un error
                    }
                });
            });
        }

        window.filtrarTabla = function() {
            const filtro = document.getElementById('searchInput').value.toLowerCase();
            const filtrados = asistentesGlobal.filter(row => 
                row.nombre.toLowerCase().includes(filtro) || 
                row.dni.includes(filtro) || 
                row.invitado_por.toLowerCase().includes(filtro)
            );
            renderTabla(filtrados);
        }
    </script>
</body>
</html>
