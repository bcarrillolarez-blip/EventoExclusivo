<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolución Financiera - Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neonBlue: '#00d2ff',
                        deepNavy: '#030b1e',
                        cardNavy: '#0a1931',
                        borderNavy: '#1b3a6b'
                    },
                    boxShadow: { 'neon': '0 0 25px rgba(0, 210, 255, 0.3)' }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Forzar el fondo a cubrir toda la pantalla */
        html, body {
            min-height: 100vh;
            margin: 0;
            padding: 0;
            background-color: #030b1e;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            display: flex;
            flex-direction: column;
        }
        .neon-card {
            background: linear-gradient(145deg, rgba(10, 25, 49, 0.9), rgba(3, 11, 30, 0.95));
            border: 1px solid rgba(0, 210, 255, 0.25);
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.15), inset 0 0 15px rgba(0, 210, 255, 0.05);
        }
        .neon-input {
            background-color: rgba(3, 11, 30, 0.8);
            border: 1px solid rgba(0, 210, 255, 0.25);
            transition: all 0.3s ease;
            font-size: 16px !important;
        }
        .neon-input:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.4);
            outline: none;
        }
        .neon-btn {
            background: linear-gradient(90deg, #00d2ff 0%, #0072ff 100%);
            box-shadow: 0 4px 20px rgba(0, 114, 255, 0.4);
            transition: all 0.3s ease;
        }
        .neon-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<!-- Quitamos justify-between. Ahora el body es solo un contenedor flexible -->
<body class="text-white selection:bg-neonBlue selection:text-black">

    <!-- Header -->
    <header class="w-full border-b border-borderNavy bg-deepNavy py-3 px-4 sm:px-6 shadow-md flex-shrink-0">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xs sm:text-base font-extrabold text-white flex items-center">
                <i class="fa-solid fa-chart-line text-cyan-400 mr-2"></i>Evolución Financiera
            </h1>
            <span class="px-2.5 py-1 rounded-md text-[10px] sm:text-xs font-semibold bg-neonBlue/10 text-cyan-400 border border-cyan-500/30">Evento Privado</span>
        </div>
    </header>

    <!-- Contenedor Principal: py-6 en móvil, items-start para alinear arriba -->
    <main class="flex-grow w-full max-w-6xl mx-auto px-4 sm:px-6 py-6 lg:py-12 flex flex-col lg:flex-row items-start justify-center gap-6 lg:gap-12">
        
        <!-- Foto / Banner del Evento -->
        <div class="w-full lg:w-1/2 flex justify-center">
            <div class="w-full max-w-md neon-card rounded-3xl p-3 sm:p-4 overflow-hidden relative">
                <div class="w-full h-56 sm:h-[480px] rounded-2xl overflow-hidden relative border border-borderNavy">
                    <img src="https://lh3.googleusercontent.com/d/1rtoZfuH3YVBCn1L1JRhp5PYI7VhkUz0h=s1000" 
                         onerror="this.src='https://placehold.co/600x1000/030b1e/00d2ff?text=Evolucion+Financiera'"
                         alt="Evento" class="w-full h-full object-cover opacity-95">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent"></div>
                </div>
            </div>
        </div>

        <!-- Formulario de Registro -->
        <div class="w-full lg:w-1/2 max-w-md neon-card rounded-3xl p-5 sm:p-8">
            <div class="text-center mb-5 sm:mb-6">
                <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-cyan-950/60 border border-cyan-500/30 text-cyan-300 text-[11px] font-semibold tracking-wider uppercase mb-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span>
                    PATIO PANORAMA • 12 NOVIEMBRE
                </div>
                <h2 class="text-xl sm:text-2xl font-extrabold text-white">Registro de Asistencia</h2>
                <p class="text-gray-400 text-xs sm:text-sm mt-1">Aparta tu cupo exclusivo completando tus datos.</p>
            </div>

            <form id="registrationForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-cyan-400 mb-1.5 flex items-center gap-1.5">
                        <i class="fa-solid fa-user text-xs"></i> Nombre y Apellido
                    </label>
                    <input type="text" id="fullname" required placeholder="Ej. Carlos Mendoza" 
                           class="neon-input w-full rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500">
                </div>
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-cyan-400 mb-1.5 flex items-center gap-1.5">
                        <i class="fa-solid fa-id-card text-xs"></i> Número de DNI
                    </label>
                    <input type="tel" id="dni" required maxlength="8" pattern="[0-9]{8}" placeholder="8 dígitos" 
                           oninput="this.value = this.value.replace(/[^0-9]/g, '')" 
                           class="neon-input w-full rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500">
                </div>
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-cyan-400 mb-1.5 flex items-center gap-1.5">
                        <i class="fa-solid fa-phone text-xs"></i> Número de Celular
                    </label>
                    <input type="tel" id="phone" required placeholder="Ej. 987654321" maxlength="9"
                           oninput="this.value = this.value.replace(/[^0-9]/g, '')" 
                           class="neon-input w-full rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500">
                </div>
                <button type="submit" id="submitBtn" 
                        class="neon-btn w-full mt-2 py-3.5 px-4 rounded-xl text-deepNavy font-extrabold text-sm tracking-wide uppercase flex items-center justify-center gap-2">
                    Registrar y Guardar
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-4 border-t border-borderNavy text-[11px] text-gray-500 bg-deepNavy mt-auto flex-shrink-0">
        Evolución Financiera • Evento Privado
    </footer>

    <!-- Scripts -->
    <script>
        function handleFormSubmit(event) {
            event.preventDefault();
            const fullname = document.getElementById('fullname').value.trim();
            const dni = document.getElementById('dni').value.trim();
            const phone = document.getElementById('phone').value.trim();

            if (dni.length !== 8) {
                alert('El número de DNI debe tener exactamente 8 dígitos.');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Guardando...';

            // ATENCIÓN: En GitHub Pages esto dará error.
            // Esta función solo funciona en el enlace de Google Apps Script (/exec)
            google.script.run
                .withSuccessHandler(function(response) {
                    btn.disabled = false;
                    btn.innerHTML = 'Registrar y Guardar';
                    document.getElementById('registrationForm').reset();
                    alert('¡Éxito! Tus datos se registraron correctamente.');
                })
                .withFailureHandler(function(error) {
                    btn.disabled = false;
                    btn.innerHTML = 'Registrar y Guardar';
                    alert('Error: Debes abrir esta página desde el enlace de Google Apps Script para guardar datos.');
                })
                .registrarDatosPC({ fullname, dni, phone });
        }
    </script>
</body>
</html>
