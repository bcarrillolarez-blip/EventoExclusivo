<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolución Financiera - Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { neonBlue: '#00d2ff', deepNavy: '#030b1e', cardNavy: '#0a1931', borderNavy: '#1b3a6b' } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        html, body { min-height: 100vh; margin: 0; padding: 0; background-color: #030b1e; }
        body { font-family: 'Inter', sans-serif; display: flex; flex-direction: column; }
        .neon-card { background: linear-gradient(145deg, rgba(10, 25, 49, 0.9), rgba(3, 11, 30, 0.95)); border: 1px solid rgba(0, 210, 255, 0.25); box-shadow: 0 0 25px rgba(0, 210, 255, 0.15); }
        .neon-input { background-color: rgba(3, 11, 30, 0.8); border: 1px solid rgba(0, 210, 255, 0.25); font-size: 16px !important; }
        .neon-input:focus { border-color: #00d2ff; box-shadow: 0 0 12px rgba(0, 210, 255, 0.4); outline: none; }
        .neon-btn { background: linear-gradient(90deg, #00d2ff 0%, #0072ff 100%); box-shadow: 0 4px 20px rgba(0, 114, 255, 0.4); }
        .neon-btn:active { transform: scale(0.98); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="text-white">
    <header class="w-full border-b border-borderNavy bg-deepNavy py-3 px-4 shadow-md flex-shrink-0">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xs sm:text-base font-extrabold text-white flex items-center"><i class="fa-solid fa-chart-line text-cyan-400 mr-2"></i>Evolución Financiera</h1>
            <span class="px-2.5 py-1 rounded-md text-[10px] sm:text-xs font-semibold bg-neonBlue/10 text-cyan-400 border border-cyan-500/30">Evento Privado</span>
        </div>
    </header>

    <main class="flex-grow w-full max-w-6xl mx-auto px-4 py-6 lg:py-12 flex flex-col lg:flex-row items-center justify-center gap-6 lg:gap-12">
        <div class="w-full lg:w-1/2 flex justify-center">
            <div class="w-full max-w-md neon-card rounded-3xl p-3 sm:p-4 overflow-hidden relative">
                <div class="w-full h-56 sm:h-[480px] rounded-2xl overflow-hidden relative border border-borderNavy">
                    <img src="https://lh3.googleusercontent.com/d/1rtoZfuH3YVBCn1L1JRhp5PYI7VhkUz0h=s1000" class="w-full h-full object-cover opacity-95 block lg:hidden">
                    <img src="https://lh3.googleusercontent.com/d/1KOvxEDuDDXreR_kZtmC4bHOgMQgh_zds=s1000" class="w-full h-full object-cover opacity-95 hidden lg:block">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent pointer-events-none"></div>
                </div>
            </div>
        </div>

        <div class="w-full lg:w-1/2 max-w-md neon-card rounded-3xl p-5 sm:p-8">
            <div class="text-center mb-5 sm:mb-6">
                <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-cyan-950/60 border border-cyan-500/30 text-cyan-300 text-[11px] font-semibold tracking-wider uppercase mb-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span> PATIO PANORAMA • 12 NOVIEMBRE
                </div>
                <h2 class="text-xl sm:text-2xl font-extrabold text-white">Registro de Asistencia</h2>
            </div>

            <div id="successMessage" class="hidden mb-4 bg-green-500/20 border border-green-500 text-green-300 px-4 py-3 rounded-xl text-sm text-center animate-fade-in">
                <i class="fa-solid fa-circle-check mr-1"></i> ¡Registro guardado exitosamente!
            </div>
            <div id="errorMessage" class="hidden mb-4 bg-red-500/20 border border-red-500 text-red-300 px-4 py-3 rounded-xl text-sm text-center">
                <i class="fa-solid fa-triangle-exclamation mr-1"></i> Error al guardar. Revisa tu conexión.
            </div>

            <form id="registrationForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-cyan-400 mb-1.5 flex items-center gap-1.5"><i class="fa-solid fa-user text-xs"></i> Nombre y Apellido</label>
                    <input type="text" id="fullname" required placeholder="Ej. Carlos Mendoza" class="neon-input w-full rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500">
                </div>
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-cyan-400 mb-1.5 flex items-center gap-1.5"><i class="fa-solid fa-id-card text-xs"></i> Número de DNI</label>
                    <input type="tel" id="dni" required maxlength="8" pattern="[0-9]{8}" placeholder="8 dígitos" oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="neon-input w-full rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500">
                </div>
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-cyan-400 mb-1.5 flex items-center gap-1.5"><i class="fa-solid fa-phone text-xs"></i> Número de Celular</label>
                    <input type="tel" id="phone" required placeholder="Ej. 987654321" maxlength="9" oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="neon-input w-full rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500">
                </div>
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-cyan-400 mb-1.5 flex items-center gap-1.5"><i class="fa-solid fa-user-tag text-xs"></i> Invitado por (Líder / Socio)</label>
                    <input type="text" id="invitadoPor" required placeholder="Ej. Nombre del líder o socio" class="neon-input w-full rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500">
                </div>
                <button type="submit" id="submitBtn" class="neon-btn w-full mt-2 py-3.5 px-4 rounded-xl text-deepNavy font-extrabold text-sm tracking-wide uppercase flex items-center justify-center gap-2">
                    Registrar y Guardar
                </button>
            </form>
        </div>
    </main>

    <footer class="w-full text-center py-4 border-t border-borderNavy text-[11px] text-gray-500 bg-deepNavy mt-auto flex-shrink-0">
        Evolución Financiera • Evento Privado
    </footer>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyD0iSjTHn0tYsqE92EGFz7O9Tnkb9qayJA",
            authDomain: "evento-financiero-6439d.firebaseapp.com",
            projectId: "evento-financiero-6439d",
            storageBucket: "evento-financiero-6439d.firebasestorage.app",
            messagingSenderId: "123911404603",
            appId: "1:123911404603:web:24667ac5e4dbc0fea7701e",
            measurementId: "G-0Q8KYLPCPF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.handleFormSubmit = async function(event) {
            event.preventDefault();
            const fullname = document.getElementById('fullname').value.trim();
            const dni = document.getElementById('dni').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const invitadoPor = document.getElementById('invitadoPor').value.trim();

            if (dni.length !== 8) {
                alert('El número de DNI debe tener exactamente 8 dígitos.');
                return;
            }

            const btn = document.getElementById('submitBtn');
            const successMsg = document.getElementById('successMessage');
            const errorMsg = document.getElementById('errorMessage');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Guardando...';
            successMsg.classList.add('hidden');
            errorMsg.classList.add('hidden');

            try {
                // Guardar en Firestore incluyendo el campo 'invitado_por'
                await addDoc(collection(db, "asistentes"), {
                    nombre: fullname,
                    dni: dni,
                    celular: phone,
                    invitado_por: invitadoPor,
                    fecha: serverTimestamp()
                });

                successMsg.classList.remove('hidden');
                document.getElementById('registrationForm').reset();
                setTimeout(() => { successMsg.classList.add('hidden'); }, 4000);
            } catch (error) {
                console.error("Error al guardar: ", error);
                errorMsg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Registrar y Guardar';
            }
        };
    </script>
</body>
</html>
